name: Backup do banco

# Dump diário da produção, criptografado com age ANTES de sair do runner e
# enviado a um bucket privado compatível com S3 (AWS S3, Cloudflare R2,
# Backblaze B2...). Nada é guardado como artefato do Actions: artefato é
# legível por quem tem acesso de leitura ao repositório.
#
# O job só gera o dump quando TODOS os segredos abaixo existem; faltando
# qualquer um, encerra com um aviso e sem tocar no banco.
#
#   DATABASE_URL_ADMIN_PROD   URL do dono do banco (de preferência com sslmode=verify-full)
#   BACKUP_AGE_RECIPIENT      chave PÚBLICA age (age1...). A privada fica fora do GitHub
#   BACKUP_S3_BUCKET          nome do bucket (privado, com versionamento/retenção)
#   BACKUP_S3_ENDPOINT        endpoint S3 (vazio para AWS; ex.: https://<conta>.r2.cloudflarestorage.com)
#   BACKUP_S3_ACCESS_KEY_ID   credencial com permissão só de escrita no bucket
#   BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_S3_REGION          ex.: us-east-1 (R2 usa "auto")
#
# Passo a passo e restauração: docs/09-operacao.md, seção "Backup".

on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-producao
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump criptografado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir configuração
        id: config
        env:
          URL: ${{ secrets.DATABASE_URL_ADMIN_PROD }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          CHAVE: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          SEGREDO: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          faltando=""
          [ -n "$URL" ]       || faltando="$faltando DATABASE_URL_ADMIN_PROD"
          [ -n "$RECIPIENT" ] || faltando="$faltando BACKUP_AGE_RECIPIENT"
          [ -n "$BUCKET" ]    || faltando="$faltando BACKUP_S3_BUCKET"
          [ -n "$CHAVE" ]     || faltando="$faltando BACKUP_S3_ACCESS_KEY_ID"
          [ -n "$SEGREDO" ]   || faltando="$faltando BACKUP_S3_SECRET_ACCESS_KEY"
          if [ -n "$faltando" ]; then
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backup não configurado (faltam:$faltando). Nenhum dump foi gerado."
          else
            case "$RECIPIENT" in
              age1*) echo "pronto=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::BACKUP_AGE_RECIPIENT precisa ser uma chave pública age (age1...)."; exit 1 ;;
            esac
          fi

      # O cliente precisa ser da mesma versão do servidor (pg_dump 15 recusa servidor 16).
      - name: Instalar pg_dump 16 e age
        if: steps.config.outputs.pronto == 'true'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 age

      - name: Gerar, conferir e criptografar
        if: steps.config.outputs.pronto == 'true'
        env:
          DATABASE_URL_ADMIN_PROD: ${{ secrets.DATABASE_URL_ADMIN_PROD }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          nome="ecossistema-$(date -u +%Y%m%d-%H%M).dump"
          claro="$RUNNER_TEMP/$nome"
          pg_dump --no-owner --no-privileges -Fc -f "$claro" "$DATABASE_URL_ADMIN_PROD"
          # Dump que não restaura não é backup: pg_restore --list falha com arquivo truncado.
          tabelas="$(pg_restore --list "$claro" | grep -c 'TABLE DATA' || true)"
          if [ "$tabelas" -lt 5 ]; then
            echo "::error::dump com só $tabelas tabelas com dados"
            exit 1
          fi
          age -r "$RECIPIENT" -o "$RUNNER_TEMP/$nome.age" "$claro"
          shred -u "$claro"
          echo "ARQUIVO=$RUNNER_TEMP/$nome.age" >> "$GITHUB_ENV"
          echo "NOME=$nome.age" >> "$GITHUB_ENV"
          echo "$tabelas tabelas com dados; $(stat -c%s "$RUNNER_TEMP/$nome.age") bytes criptografados"

      - name: Enviar ao bucket privado
        if: steps.config.outputs.pronto == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'us-east-1' }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          extra=()
          [ -n "$ENDPOINT" ] && extra=(--endpoint-url "$ENDPOINT")
          aws "${extra[@]}" s3 cp "$ARQUIVO" "s3://$BUCKET/postgres/$NOME" --only-show-errors
          rm -f "$ARQUIVO"
          echo "enviado: s3://$BUCKET/postgres/$NOME"
